services:
    # Nginx: обратный прокси, отдаёт PHP-FPM. Веб-интерфейс it-learns на http://localhost:8000.
    nginx:
        image: "nginx:stable-alpine"
        ports:
            - "8000:80"
        restart: unless-stopped
        volumes:
            - ./dockerfiles/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - .:/var/www/laravel
        depends_on:
            - db
            - php
        networks:
            - itlearns

    # PHP-FPM: основной runtime Laravel.
    php:
        build:
            context: dockerfiles
            dockerfile: php.Dockerfile
        restart: unless-stopped
        volumes:
            - .:/var/www/laravel
        networks:
            - itlearns

    # MariaDB: основная БД для разработки.
    # Тестовая БД — отдельный сервис `db-testing` (см. AGENTS.md §3.1).
    db:
        image: mariadb
        ports:
            - "3316:3306"
        restart: unless-stopped
        env_file:
            - .env
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_ALLOW_EMPTY_PASSWORD: YES
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - itlearns
        command:
          - --max_allowed_packet=1G
          - --innodb_buffer_pool_size=2G
          - --innodb_log_file_size=512M

    # phpMyAdmin: UI для БД на http://localhost:8080.
    # Только для dev, в проде не используется.
    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        ports:
            - 8080:80
        links:
            - db
        depends_on:
            - db
        restart: unless-stopped
        environment:
            PMA_HOST: db
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}
            PMA_ARBITRARY: 1
            UPLOAD_LIMIT: 640M
        networks:
            - itlearns

    # Composer: утилитарный контейнер для `docker compose run composer install` и т.п.
    composer:
        build:
            context: dockerfiles
            dockerfile: composer.Dockerfile
        volumes:
            - .:/var/www/laravel
        networks:
            - itlearns

    # Artisan: утилитарный контейнер для artisan-команд.
    # Использование: `docker compose run --rm artisan migrate`, `docker compose run --rm artisan test` и т.п.
    artisan:
        build:
            context: dockerfiles
            dockerfile: php.Dockerfile
        volumes:
            - .:/var/www/laravel
        networks:
            - itlearns
        entrypoint: ["php", "/var/www/laravel/artisan"]

    # Тестовая БД. Поднимается через `composer test` (см. AGENTS.md §3.1).
    # `profiles: ["testing"]` — не стартует при обычном `docker compose up`.
    db-testing:
        image: mariadb:11
        container_name: itlearns-db-testing
        profiles: ["testing"]
        environment:
            MYSQL_ROOT_PASSWORD: ""
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: it_learns_test
        ports:
            - "3317:3306"
        volumes:
            - db_testing_data:/var/lib/mysql
        networks:
            - itlearns
        healthcheck:
            test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root"]
            interval: 3s
            timeout: 3s
            retries: 20
            start_period: 10s

volumes:
    db_data:
    db_testing_data:

networks:
    itlearns:
        driver: bridge


